# 仅部署应用：ai-service + java-service
# Postgres / MinIO 不在此文件编排，需事先启动（同仓库：docker compose up -d）
#
# 用法：
#   docker compose up -d
#   docker compose -f docker-compose.deploy.yml up -d --build
#
# 应用容器加入基础设施网络 cocktails_default，用服务名访问 postgres / minio
name: cocktails-app

services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cocktails-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-cocktail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cocktail}
      POSTGRES_DB: ${POSTGRES_DB:-cocktail}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cocktail}:${POSTGRES_PASSWORD:-cocktail}@postgres:5432/${POSTGRES_DB:-cocktail}
      MINIO_HOST: minio
      MINIO_API_PORT: "9000"
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cocktail-images}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      # 返回给前端的图片 URL，填公网可达地址（.env 的 MINIO_PUBLIC_BASE）
      MINIO_PUBLIC_BASE: ${MINIO_PUBLIC_BASE:-http://127.0.0.1:9000}
    ports:
      - "8000:8000"
    networks:
      - infra

  java-service:
    build:
      context: ./java-service
      dockerfile: Dockerfile
    container_name: cocktails-java
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-cocktail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cocktail}
      POSTGRES_DB: ${POSTGRES_DB:-cocktail}
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-cocktail-dev-secret-change-me-please-32bytes}
      WECHAT_MP_APPID: ${WECHAT_MP_APPID:-}
      WECHAT_MP_SECRET: ${WECHAT_MP_SECRET:-}
      AVATAR_DIR: /app/data/avatars
    ports:
      - "8080:8080"
    volumes:
      - java_avatars:/app/data/avatars
    depends_on:
      - ai-service
    networks:
      - infra

volumes:
  java_avatars:

networks:
  infra:
    external: true
    name: cocktails_default
