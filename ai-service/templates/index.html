<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鸡尾酒知识库 · 数据获取 MVP</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap">
    <h1>鸡尾酒知识库 MVP</h1>
    <p class="sub">从 MixMyth 或 TheCocktailDB 拉取配方，清洗后写入本地知识库并在此展示。</p>

    <section class="panel">
      <div class="row">
        <label>
          爬取站点
          <select id="source">
            <option value="mixmyth">MixMyth 谜酌</option>
            <option value="cocktaildb">TheCocktailDB</option>
            <option value="all">两个站点都爬</option>
          </select>
        </label>
        <button id="crawlBtn" type="button">开始爬取</button>
        <label>
          展示来源
          <select id="filterSource">
            <option value="">全部</option>
            <option value="mixmyth">MixMyth</option>
            <option value="cocktaildb">CocktailDB</option>
          </select>
        </label>
        <input id="keyword" type="search" placeholder="搜索中英文名称">
        <button class="ghost" id="searchBtn" type="button">筛选</button>
        <button class="ghost" id="exportBtn" type="button">导出全部 Excel</button>
      </div>
      <div class="stats">
        <span>库存合计 <b id="totalCount">0</b></span>
        <span>MixMyth <b id="mixmythCount">0</b></span>
        <span>CocktailDB <b id="cocktaildbCount">0</b></span>
        <span>已向量化 <b id="chunkCount">0</b></span>
      </div>
      <div class="status" id="status">就绪</div>
    </section>

    <section class="panel">
      <div class="row">
        <button id="embedBtn" type="button">向量化入库</button>
        <input id="ragQuery" type="search" placeholder="语义检索，例如：清爽的朗姆酒短饮">
        <button class="ghost" id="ragSearchBtn" type="button">语义检索</button>
      </div>
      <div class="status" id="ragStatus">BGE-M3 · 每条配方一段 chunk</div>
    </section>

    <section class="panel chat-panel">
      <div class="chat-head">
        <strong>鸡尾酒助手</strong>
        <span class="sub">会识别「查库」还是「定制特调」；现成配方带库图，定制会参考知识库再生图</span>
      </div>
      <div class="chat-log" id="chatLog">
        <div class="chat-msg assistant">可以说「莫吉托怎么做」查库，或「帮我定制一杯朗姆特调」。定制时做法不清我会先问基酒和调制方式。</div>
      </div>
      <form class="chat-form" id="chatForm">
        <input id="chatInput" type="text" autocomplete="off" placeholder="输入问题，Enter 发送">
        <button id="chatSend" type="submit">发送</button>
      </form>
    </section>

    <section class="grid" id="grid"></section>
    <div class="pager">
      <button class="ghost" id="prevBtn" type="button">上一页</button>
      <span id="pageInfo">0 / 0</span>
      <button class="ghost" id="nextBtn" type="button">下一页</button>
    </div>
  </div>

  <dialog id="detail">
    <div class="modal" id="detailBody"></div>
  </dialog>

  <script>
    const pageSize = 24;
    let offset = 0;
    let total = 0;
    let timer = null;
    let ragTimer = null;

    const el = (id) => document.getElementById(id);

    async function fetchJSON(url, options) {
      const res = await fetch(url, options);
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "请求失败");
      return data;
    }

    async function loadStats() {
      const data = await fetchJSON("/api/stats");
      el("totalCount").textContent = data.total;
      el("mixmythCount").textContent = data.by_source.mixmyth || 0;
      el("cocktaildbCount").textContent = data.by_source.cocktaildb || 0;
      el("chunkCount").textContent = data.chunks || 0;
    }

    async function loadRecipes() {
      const source = el("filterSource").value;
      const q = el("keyword").value.trim();
      const params = new URLSearchParams({ limit: pageSize, offset });
      if (source) params.set("source", source);
      if (q) params.set("q", q);
      const data = await fetchJSON("/api/recipes?" + params.toString());
      total = data.total;
      el("pageInfo").textContent = `${Math.min(offset + 1, total)}-${Math.min(offset + pageSize, total)} / ${total}`;
      el("grid").innerHTML = data.items.map((item) => `
        <article class="card" data-id="${item.id}">
          <img src="${item.image_url || ""}" alt="${item.name}" referrerpolicy="no-referrer" onerror="this.style.display='none'">
          <div class="body">
            <span class="tag">${item.source}</span>
            <h3>${item.name}</h3>
            <div class="meta">${item.name_en || ""} · ${item.glass || "杯型未知"} · ${item.method_label || item.method}</div>
          </div>
        </article>
      `).join("") || "<p class='sub'>还没有数据，先选一个站点爬取。</p>";
      document.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("click", () => openDetail(card.dataset.id));
      });
    }

    async function openDetail(id) {
      const item = await fetchJSON("/api/recipes/" + id);
      const ings = item.ingredients.map((row) => {
        const amount = row.amount == null ? "" : row.amount;
        return `<li>${row.name} ${amount}${row.unit || ""}</li>`;
      }).join("");
      const spec = (value, label) => value ? `<div><b>${value}</b><span>${label}</span></div>` : "";
      el("detailBody").innerHTML = `
        <h2>${item.name}</h2>
        <p class="meta">${item.name_en || ""} · ${item.source}/${item.source_id}</p>
        ${item.image_url ? `<div class="hero"><img src="${item.image_url}" alt="${item.name}" referrerpolicy="no-referrer"></div>` : ""}
        ${item.description ? `<p class="desc">${item.description}</p>` : ""}
        <div class="specs">
          ${spec(item.glass, "杯型")}
          ${spec(item.method_label || item.method, "调制方式")}
          ${spec(item.base_spirit, "基酒")}
          ${spec(item.abv_range, "酒精度")}
        </div>
        <p>${(item.flavor_tags || []).map((tag) => `<span class="tag">${tag}</span>`).join("")}</p>
        ${item.garnish ? `<p class="meta">装饰：${item.garnish}</p>` : ""}
        <h3>材料</h3>
        <ul class="ing">${ings}</ul>
        <h3>步骤</h3>
        <pre>${item.instructions || "暂无"}</pre>
        <p><button class="ghost" onclick="document.getElementById('detail').close()">关闭</button></p>
      `;
      el("detail").showModal();
    }

    async function refreshStatus() {
      const data = await fetchJSON("/api/crawl/status");
      const box = el("status");
      box.classList.toggle("error", Boolean(data.error));
      box.textContent = data.running
        ? `${data.progress} · 已抓 ${data.fetched}`
        : (data.error || data.progress || "就绪");
      el("crawlBtn").disabled = Boolean(data.running);
      if (!data.running) {
        clearInterval(timer);
        timer = null;
        await loadStats();
        await loadRecipes();
      }
    }

    el("crawlBtn").addEventListener("click", async () => {
      try {
        await fetchJSON("/api/crawl", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source: el("source").value }),
        });
        if (!timer) timer = setInterval(refreshStatus, 1000);
        await refreshStatus();
      } catch (err) {
        el("status").textContent = err.message;
        el("status").classList.add("error");
      }
    });
    el("searchBtn").addEventListener("click", async () => { offset = 0; await loadRecipes(); });
    el("exportBtn").addEventListener("click", () => {
      window.location.href = "/api/recipes/export.xlsx";
    });

    async function refreshEmbedStatus() {
      const data = await fetchJSON("/api/rag/embed/status");
      const box = el("ragStatus");
      box.classList.toggle("error", Boolean(data.error));
      box.textContent = data.running
        ? `${data.progress} · ${data.upserted}/${data.total || "?"}`
        : (data.error || data.progress || "BGE-M3 · 每条配方一段 chunk");
      el("embedBtn").disabled = Boolean(data.running);
      if (!data.running) {
        clearInterval(ragTimer);
        ragTimer = null;
        await loadStats();
      }
    }

    el("embedBtn").addEventListener("click", async () => {
      try {
        await fetchJSON("/api/rag/embed", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ force: false }),
        });
        if (!ragTimer) ragTimer = setInterval(refreshEmbedStatus, 1000);
        await refreshEmbedStatus();
      } catch (err) {
        el("ragStatus").textContent = err.message;
        el("ragStatus").classList.add("error");
      }
    });

    el("ragSearchBtn").addEventListener("click", async () => {
      const q = el("ragQuery").value.trim();
      if (!q) return;
      const source = el("filterSource").value;
      const params = new URLSearchParams({ q, k: "8" });
      if (source) params.set("source", source);
      const data = await fetchJSON("/api/rag/search?" + params.toString());
      total = data.items.length;
      offset = 0;
      el("pageInfo").textContent = `语义 ${data.items.length} 条`;
      el("grid").innerHTML = data.items.map((item) => `
        <article class="card" data-id="${item.id}">
          <img src="${item.image_url || ""}" alt="${item.name}" referrerpolicy="no-referrer" onerror="this.style.display='none'">
          <div class="body">
            <span class="tag">${item.source}</span>
            <span class="tag">相关 ${item.score}</span>
            <h3>${item.name}</h3>
            <div class="meta">${item.name_en || ""} · ${item.glass || "杯型未知"} · ${item.method_label || item.method}</div>
          </div>
        </article>
      `).join("") || "<p class='sub'>没有检索到相关配方，请先向量化入库。</p>";
      document.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("click", () => openDetail(card.dataset.id));
      });
    });
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function chatSessionId() {
      const key = "cocktail-chat-session";
      let id = localStorage.getItem(key);
      if (!id) {
        id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now());
        localStorage.setItem(key, id);
      }
      return id;
    }

    function appendChat(role, html, extraClass) {
      const node = document.createElement("div");
      node.className = `chat-msg ${role}${extraClass ? " " + extraClass : ""}`;
      node.innerHTML = html;
      el("chatLog").appendChild(node);
      el("chatLog").scrollTop = el("chatLog").scrollHeight;
      return node;
    }

    async function readSse(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop();
        for (const part of parts) {
          const line = part.split("\n").find((row) => row.startsWith("data: "));
          if (!line) continue;
          onEvent(JSON.parse(line.slice(6)));
        }
      }
    }

    el("chatForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = el("chatInput").value.trim();
      if (!message || el("chatSend").disabled) return;
      el("chatInput").value = "";
      appendChat("user", escapeHtml(message));
      const bot = appendChat("assistant", "正在检索配方…");
      el("chatSend").disabled = true;
      try {
        const res = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: chatSessionId(), message }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || "对话失败");
        }
        let answer = "";
        let sourcesHtml = "";
        let photosHtml = "";
        const loadingHtml = `<div class="chat-photos custom"><div class="chat-photo-loading"><span class="spinner"></span><span>正在生成特调配图…</span></div></div>`;
        const paint = () => {
          bot.innerHTML = sourcesHtml + photosHtml + (answer ? escapeHtml(answer) : "");
          bot.querySelectorAll("button[data-id]").forEach((btn) => {
            btn.addEventListener("click", () => openDetail(btn.dataset.id));
          });
          el("chatLog").scrollTop = el("chatLog").scrollHeight;
        };
        await readSse(res, (payload) => {
          if (payload.type === "intent") {
            if (payload.mode === "customize") bot.textContent = "按你的口味定制特调…";
            else if (payload.value === "library") bot.textContent = "正在对照配方库…";
          } else if (payload.type === "mode" && payload.value === "clarify") {
            bot.textContent = "想先确认基酒和做法…";
          } else if (payload.type === "sources") {
            const items = payload.items || [];
            const label = payload.role === "reference" ? "参考配方" : "库内配方";
            sourcesHtml = items.length
              ? `<div class="chat-sources"><span class="chat-source-label">${label}</span>${items.map((item) =>
                  `<button type="button" data-id="${item.id}">${
                    item.image_url ? `<img src="${escapeHtml(item.image_url)}" alt="">` : ""
                  }<span>${escapeHtml(item.name)}</span></button>`
                ).join("")}</div>`
              : "";
            paint();
          } else if (payload.type === "images") {
            const items = payload.items || [];
            photosHtml = items.length
              ? `<div class="chat-photos">${items.map((item) =>
                  `<img src="${escapeHtml(item.url)}" alt="${escapeHtml(item.alt || "")}" ${
                    item.recipe_id ? `data-id="${item.recipe_id}"` : ""
                  }>`
                ).join("")}</div>`
              : photosHtml;
            paint();
            bot.querySelectorAll(".chat-photos img[data-id]").forEach((img) => {
              img.addEventListener("click", () => openDetail(img.dataset.id));
            });
          } else if (payload.type === "status") {
            if (!answer) bot.textContent = payload.text || "处理中…";
          } else if (payload.type === "image_loading") {
            photosHtml = loadingHtml;
            paint();
          } else if (payload.type === "image" && payload.url) {
            photosHtml = `<div class="chat-photos custom"><img src="${escapeHtml(payload.url)}" alt="${escapeHtml(payload.alt || "定制特调")}"></div>`;
            paint();
          } else if (payload.type === "image_error") {
            photosHtml = `<p class="meta">配图未生成：${escapeHtml(payload.message || "")}</p>`;
            paint();
          } else if (payload.type === "token") {
            answer += payload.text || "";
            paint();
          } else if (payload.type === "error") {
            throw new Error(payload.message || "对话失败");
          }
        });
        if (!answer) bot.innerHTML = sourcesHtml + photosHtml + "没有生成回答。";
      } catch (err) {
        bot.classList.add("error");
        bot.textContent = err.message;
      } finally {
        el("chatSend").disabled = false;
        el("chatInput").focus();
      }
    });

    el("filterSource").addEventListener("change", async () => { offset = 0; await loadRecipes(); });
    el("prevBtn").addEventListener("click", async () => {
      offset = Math.max(0, offset - pageSize);
      await loadRecipes();
    });
    el("nextBtn").addEventListener("click", async () => {
      if (offset + pageSize < total) offset += pageSize;
      await loadRecipes();
    });

    loadStats().then(loadRecipes).then(refreshStatus);
  </script>
</body>
</html>
